name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rustdoc-v*

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # The below settings are based on advice from:
  # https://corrode.dev/blog/tips-for-faster-ci-builds/
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # This job is a prerequisite for every job that may execute Cargo against this
  # repository. Keep the checker and its content-pinned exceptions in `.github/`.
  build-script-policy:
    name: Reject unapproved build scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce the build-script policy
        run: python3 .github/scripts/check_build_scripts.py

  ci-everything:
    name: All CI stages
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - build-script-policy
      - lint
      - rust-tests
      - test-crates
    if: ${{ success() || failure() }}  # Run this job even if a dependency has failed.
    steps:
      - name: Job outcomes
        run: |
          echo "build-script-policy: ${{ needs.build-script-policy.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "rust-tests: ${{ needs.rust-tests.result }}"
          echo "test-crates: ${{ needs.test-crates.result }}"

      # Fail this required job if any of its dependent jobs have failed.
      #
      # Do not attempt to consolidate these steps into one step, it won't work.
      # Multi-line `if` clauses are not evaluated properly: see the intermediate commits in
      # https://github.com/obi1kenobi/cargo-semver-checks/pull/405
      - if: ${{ needs.build-script-policy.result != 'success' }}
        run: exit 1
      - if: ${{ needs.lint.result != 'success' }}
        run: exit 1
      - if: ${{ needs.rust-tests.result != 'success' }}
        run: exit 1
      - if: ${{ needs.test-crates.result != 'success' }}
        run: exit 1

  lint:
    name: Check lint and rustfmt
    runs-on: ubuntu-latest
    needs:
      - build-script-policy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy
          rustflags: ""

      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings -Dclippy::print_stdout -Dclippy::print_stderr -Dclippy::dbg_macro --allow deprecated

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --document-private-items

  rust-tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs:
      - build-script-policy
    strategy:
      matrix:
        toolchain: ["beta", "nightly"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ matrix.toolchain }}
          rustflags: ""

      - name: Regenerate test data
        run: ./scripts/regenerate_test_rustdocs.sh +${{ matrix.toolchain }}

      - name: compile
        run: cargo test --no-run

      - name: test
        run: cargo test

      - name: compile with rayon
        run: cargo test --no-run --features rayon

      - name: test with rayon
        run: cargo test --features rayon

      - name: compile with rayon and rustc-hash
        run: cargo test --no-run --features rayon,rustc-hash

      - name: test with rayon and rustc-hash
        run: cargo test --features rayon,rustc-hash

  test-crates:
    name: Run test crate tests
    runs-on: ubuntu-latest
    needs:
      - build-script-policy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          rustflags: ""

      - name: Run test crate tests
        run: ./scripts/test_crates.sh

  verify-package:
    name: Verify package
    runs-on: ubuntu-latest
    needs:
      - should-publish
      - ci-everything
      - pre-publish-checks
    if: needs.should-publish.outputs.trigger_publish == 'yes'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Verify package
        run: cargo publish --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --dry-run --locked

  # This job handles write credentials but never checks out or executes repository code.
  tag-version:
    name: Tag the version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - should-publish
      - ci-everything
      - pre-publish-checks
      - verify-package
    if: needs.should-publish.outputs.trigger_publish == 'yes'
    steps:
      - name: Create or verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          PUBLISH_TAG: ${{ needs.should-publish.outputs.publish_tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "push" ||
                "$GITHUB_REF_TYPE" != "branch" ||
                "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]]; then
            echo "Refusing to tag a non-branch push: $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing invalid release commit: $EXPECTED_SHA" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_BRANCH" =~ ^rustdoc-v([0-9]{2,3})$ ]]; then
            echo "Refusing invalid release branch: $RELEASE_BRANCH" >&2
            exit 1
          fi
          branch_major="${BASH_REMATCH[1]}"
          if [[ ! "$PUBLISH_TAG" =~ ^v([0-9]{2,3})\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Refusing invalid release tag: $PUBLISH_TAG" >&2
            exit 1
          fi
          tag_major="${BASH_REMATCH[1]}"
          if [[ "$tag_major" != "$branch_major" ]]; then
            echo "Release tag major $tag_major does not match branch major $branch_major" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$PUBLISH_TAG"

          # GitHub returns prefix matches here, so filter down to the exact tag.
          get_tag_target() {
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$PUBLISH_TAG" \
              --jq ".[] | select(.ref == \"refs/tags/$PUBLISH_TAG\") | [.ref, .object.type, .object.sha] | @tsv"
          }

          # Reuse durable tag state from an earlier attempt when present.
          tag_target="$(get_tag_target)"

          # An empty result means this run still needs to create the tag.
          if [[ -z "$tag_target" ]]; then
            # Only a current branch-tip workflow may create a new tag.
            branch_target="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" \
                --jq '[.ref, .object.type, .object.sha] | @tsv'
            )"
            IFS=$'\t' read -r branch_ref branch_type branch_sha <<< "$branch_target"
            if [[ "$branch_ref" != "$GITHUB_REF" ||
                  "$branch_type" != "commit" ||
                  "$branch_sha" != "$EXPECTED_SHA" ]]; then
              echo "The release branch changed while this workflow was running" >&2
              exit 1
            fi

            # Always reread durable state in case creation succeeded despite a client error.
            if ! gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$PUBLISH_TAG" \
                -f "sha=$EXPECTED_SHA" \
                --silent; then
              echo "Tag creation request did not report success; checking repository state." >&2
            fi
            tag_target="$(get_tag_target)"
          fi

          # The tag must now exist whether it predated this run or was just created.
          if [[ -z "$tag_target" ]]; then
            echo "Failed to create release tag $PUBLISH_TAG at $EXPECTED_SHA" >&2
            exit 1
          fi

          # Accept only the expected lightweight tag at this workflow's commit.
          IFS=$'\t' read -r tag_ref tag_type tag_sha <<< "$tag_target"
          if [[ "$tag_ref" != "refs/tags/$PUBLISH_TAG" ||
                "$tag_type" != "commit" ||
                "$tag_sha" != "$EXPECTED_SHA" ]]; then
            printf 'Refusing release tag: ref=%q type=%q sha=%q\n' \
              "$tag_ref" "$tag_type" "$tag_sha" >&2
            exit 1
          fi

          echo "Release tag $PUBLISH_TAG points at $EXPECTED_SHA."

  # Package verification compiles the crate, so keep it outside this credentialed job.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs:
      - should-publish
      - ci-everything
      - tag-version
      - pre-publish-checks
    if: needs.should-publish.outputs.trigger_publish == 'yes'
    permissions:
      contents: read
      id-token: write     # Required for OIDC token exchange (Trusted Publishing)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      # For Trusted Publishing:
      # https://crates.io/docs/trusted-publishing
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish
        # Cargo discovers configuration from its working directory, not from
        # --manifest-path. Run outside the checkout so repository-controlled
        # configuration cannot change the registry or credential provider while
        # the publishing token is available.
        working-directory: ${{ runner.temp }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --no-verify --locked

  did-version-change:
    name: Check if version changed
    runs-on: ubuntu-latest
    needs:
      - build-script-policy
    outputs:
      is_new_version: ${{ steps.check.outputs.is_new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: check
        run: |
          set +e
          ./scripts/is_version_already_uploaded.sh trustfall-rustdoc-adapter
          export EXIT_CODE="$?"
          set -e
          if [[ "$EXIT_CODE" == "7" ]]; then
            echo "is_new_version=no" >> "$GITHUB_OUTPUT"
          elif [[ "$EXIT_CODE" == "0" ]]; then
            echo "is_new_version=yes" >> "$GITHUB_OUTPUT"
          else
            # Unexpected outcome, indicates a bug.
            exit "$EXIT_CODE"
          fi

  should-publish:
    name: Determine whether to publish
    runs-on: ubuntu-latest
    needs:
      - did-version-change
    if: needs.did-version-change.outputs.is_new_version == 'yes'
    outputs:
      publish_tag: ${{ steps.evaluate.outputs.publish_tag }}
      trigger_publish: ${{ steps.evaluate.outputs.trigger_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: evaluate
        env:
          VERSION_CHANGED: ${{ needs.did-version-change.outputs.is_new_version }}
        run: |
          set -euo pipefail

          if [[ "$VERSION_CHANGED" != "yes" ]]; then
            echo "Version was not updated, skipping publish."
            echo "trigger_publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_REF="${GITHUB_REF#refs/heads/}"

          if [[ ! "$BRANCH_REF" =~ ^rustdoc-v([0-9]{2,3})$ ]]; then
            echo "Branch ${BRANCH_REF} is not an allowed release branch."
            echo "trigger_publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_MAJOR="${BASH_REMATCH[1]}"
          CURRENT_VERSION="$(python - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['package']['version'])
          PY
          )"
          MAJOR_VERSION="${CURRENT_VERSION%%.*}"

          if [[ "$BRANCH_MAJOR" != "$MAJOR_VERSION" ]]; then
            echo "Branch major version ${BRANCH_MAJOR} does not match Cargo.toml major version ${MAJOR_VERSION}."
            echo "trigger_publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUBLISH_TAG="v$CURRENT_VERSION"
          git check-ref-format "refs/tags/$PUBLISH_TAG"
          echo "publish_tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"
          echo "trigger_publish=yes" >> "$GITHUB_OUTPUT"

  pre-publish-checks:
    name: Check for semver compliance
    runs-on: ubuntu-latest
    needs:
      - ci-everything
      - should-publish
    if: needs.should-publish.outputs.trigger_publish == 'yes'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
