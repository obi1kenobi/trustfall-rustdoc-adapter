[package]
name = "features_dependency_feature"
version = "0.1.0"
edition = "2024"
publish = false

[features]
strong = ["serde_json/std"]
serde_json = ["dep:serde_json", "marker"]
marker = []

[dependencies]
# An explicit dependency feature keeps `PackageData` from dropping `optional = true`
# when it converts this dependency to `cargo_toml`'s representation.
serde_json = { version = "1.0", optional = true, features = ["std"] }
