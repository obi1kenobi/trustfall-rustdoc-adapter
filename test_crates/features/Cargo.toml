[package]
name = "features"
version = "0.1.0"
edition = "2024"

[features]
default = ["foo", "bar"]

# these are (transitively) enabled by default
foo = ["baz"]
bar = []
baz = []

# this feature is considered internal
_internal = []

# this feature is opt-in only, not default
opt_in = []

# The `dep:` prefix suppresses the implicit `serde` feature.
serialization = ["dep:serde"]

# A weak dependency-feature reference preserves the implicit `serde_json` feature
# but only forwards `std` when the dependency is enabled elsewhere.
json_weak = ["serde_json?/std"]

# this feature is nightly-only and not considered stable
nightly = []

# features for testing transitive enables across several steps
chain_root = ["chain_mid"]
chain_mid = ["chain_deep"]
chain_deep = ["chain_leaf"]
chain_leaf = []

[dependencies]
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
